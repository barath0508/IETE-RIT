<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="ieteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="150" cy="150" r="140" fill="url(#ieteBg)" stroke="#2563eb" stroke-width="4" />
  <circle cx="150" cy="150" r="126" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Outer Text Arc Path -->
  <path id="textArcTop" d="M 40,150 A 110,110 0 1,1 260,150" fill="none" />
  
  <!-- Outer Ring Wording -->
  <text font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      INSTITUTION OF ELECTRONICS &amp; TELECOM ENGRS
    </textPath>
  </text>

  <!-- Center Crest -->
  <circle cx="150" cy="150" r="85" fill="#0284c7" opacity="0.15" />
  <circle cx="150" cy="150" r="75" fill="none" stroke="#60a5fa" stroke-width="2" />

  <!-- Electronic Wave / Sine Wave & Tech Motif -->
  <path d="M 85 150 Q 100 110 120 150 T 155 150 T 190 150 T 215 150" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 85 150 Q 100 190 120 150 T 155 150 T 190 150 T 215 150" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Atomic Orbit / Telecom Signal Rings -->
  <ellipse cx="150" cy="150" rx="65" ry="24" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-30 150 150)" opacity="0.8" />
  <ellipse cx="150" cy="150" rx="65" ry="24" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(30 150 150)" opacity="0.8" />
  <circle cx="150" cy="150" r="8" fill="url(#goldGrad)" />

  <!-- Main IETE Text -->
  <text x="150" y="215" font-family="'Inter', sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="4">IETE</text>
  <text x="150" y="235" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#93c5fd" text-anchor="middle" letter-spacing="3">ESTD 1953</text>
</svg>
